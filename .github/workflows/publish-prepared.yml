name: Publish prepared simulation update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified update with public identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/Hamstory/retirement-simulator/git/commits --input - <<'JSON'
          {"message":"Add conditioned random paths, crash recovery, and safe asset caps","tree":"00a736c5fa667cf9f7504fce8439802326302e5d","parents":["${{ github.sha }}"],"author":{"name":"Hamstory","email":"17463386+Hamstory@users.noreply.github.com"},"committer":{"name":"Hamstory","email":"17463386+Hamstory@users.noreply.github.com"}}
          JSON
